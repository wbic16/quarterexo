[package]
name = "qexo"
version = "1.5.0"
description = "qexo — the Exocortex coordinator, phext-native: all node state lives in one phext (system /var/lib/qexo or per-user ~/.qexo; Layer 2 addressing over phext)"
license = "MIT"
edition = "2021"

# The bake/ directory holds build-time generated artifacts
# (tools/build_bake_remote.py from qexo-bake.toml). It is included in
# the package so the published crate builds anywhere; bake/ itself is
# never a hand-edited source.
include = [
    "src/**", "bake/**", "census.tsv",
    "Cargo.toml", "CHANGELOG.md", "SHIP-NOTES.md", "VERSION",
    "qexo-bake.toml", "docs/**", "README.md",
]

[dependencies]
# The phext reckoning is libphext-rs's (v1.3.0): the reference
# implementation SQ and Phext Notepad share. Pinned at 0.6.0 —
# the chains release (0x02 chain break, 0x03 chain close, $N:
# universe addressing) — resolved from the crates.io registry.
# qexo's src/phext.rs is only an adapter; it uses none of the
# chain surface yet (chains are a separate slice, if ever).
libphext = "0.6.0"

[profile.release]
opt-level = 2
